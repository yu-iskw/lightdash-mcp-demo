name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", ".agents/**", ".claude/**", ".cursor/**", ".vscode/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", ".agents/**", ".claude/**", ".cursor/**", ".vscode/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  ci:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Test, analyze, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v6
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # ratchet:step-security/harden-runner@v2.19.4
        with:
          egress-policy: audit
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # ratchet:pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # ratchet:actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm build
      - name: Run tests
        run: pnpm test
      - name: Find unused code (Knip)
        run: pnpm knip
      - name: Trunk Check
        if: github.event_name != 'push'
        uses: trunk-io/trunk-action@75699af9e26881e564e9d832ef7dc3af25ec031b # ratchet:trunk-io/trunk-action@v1
        with:
          setup-deps: true
